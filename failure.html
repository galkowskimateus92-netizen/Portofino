<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento não concluído — Portofino</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Cinzel:wght@500&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#F6F4EE; color:#0D1B2A; font-family:'Montserrat',sans-serif; text-align:center; padding:20px; }
  .box{ max-width:420px; animation: pfFadeUp .5s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes pfFadeUp{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }
  .anchor{ font-size:42px; color:#5B1E2D; margin-bottom:18px; animation: pfAnchorPop .5s .1s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes pfAnchorPop{ from{ opacity:0; transform:scale(.5) rotate(-15deg);} to{ opacity:1; transform:scale(1) rotate(0);} }
  a{ transition: transform .2s ease, opacity .2s ease; }
  a:hover{ transform: translateY(-2px); opacity:.9; }
  h1{ font-family:'Cinzel',serif; letter-spacing:3px; font-size:22px; margin-bottom:10px; }
  p{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:17px; opacity:0.8; margin-bottom:26px; }
  a{ display:inline-block; background:#0D1B2A; color:#F6F4EE; padding:13px 28px; font-size:11px;
    letter-spacing:2px; text-decoration:none; border-radius:2px; }
</style>
</head>
<body>
  <div class="box">
    <div class="anchor">⚓</div>
    <h1>PAGAMENTO NÃO CONCLUÍDO</h1>
    <p>Algo deu errado ou o pagamento foi cancelado. Nenhuma cobrança foi feita — você pode tentar novamente.</p>
    <a href="/">VOLTAR PARA A LOJA</a>
  </div>
</body>
</html>
