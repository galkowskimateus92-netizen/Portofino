<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido confirmado — Portofino</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Cinzel:wght@500&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>

  a{ display:inline-block; background:#0D1B2A; color:#F6F4EE; padding:13px 28px; font-size:11px;
    letter-spacing:2px; text-decoration:none; border-radius:2px; }
</style>
</head>
<body>
  <div class="box">
    <div class="anchor">⚓</div>
    <h1>PEDIDO CONFIRMADO</h1>
    <p>Obrigado por escolher a Portofino. Você vai receber um e-mail com os detalhes do pedido em breve.</p>
    <a href="/">VOLTAR PARA A LOJA</a>
  </div>

</html>
